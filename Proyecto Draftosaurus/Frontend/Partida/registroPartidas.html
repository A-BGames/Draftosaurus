<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tipografías -->
    <link href="https://fonts.googleapis.com/css2?family=Henny+Penny&family=Boogaloo&display=swap" rel="stylesheet">

    <!-- Estilos del juego -->
    <link rel="stylesheet" href="registroPartidas.css">

    <title>Registrar Partida</title>
</head>

<body>

    <!-- CONTENEDOR PRINCIPAL -->
    <main id="tablerosContainer" class="container-fluid d-flex flex-column align-items-center">

        <!-- 🔥 CONTROLES GLOBALES (Dado + Turno + Botones) -->
        <div id="botonesGlobales" class="d-flex flex-wrap justify-content-center align-items-center gap-3 my-3">
            <img src="../../../Imagenes/dadoAgua.PNG" alt="dado" id="dadoGlobal" />

            <button id="lanzarDado" class="btn">Lanzar Dado</button>

            <div id="turnoActualTexto" class="text-center">Turno de:</div>

            <button id="finalizar" class="btn">Finalizar</button>
            <button id="pausar" class="btn">Pausar</button>
        </div>

        <!-- 🎮 TABLEROS DINÁMICOS (Aquí se insertan automáticamente) -->
        <div id="contenedorTableros" class="row justify-content-center g-4 w-100">
            <!-- JS insertará los tableros aquí -->
        </div>

    </main>

    <!-- 🧩 TEMPLATE DEL TABLERO (NO SE RENDERIZA HASTA QUE JS LO CLONA) -->
    <template id="templateTablero">
        <div class="col-12 col-md-6 col-lg-6 d-flex justify-content-center">
            <section class="tableroJugador">

                <h3 class="nombreJugador"></h3>

                <div class="contenedorTablero">
                    <img src="../../../Imagenes/drarftosurus verano.JPG" alt="tablero" class="tablero" />

                    <!-- Zonas de colocación -->
                    <div class="zonas zona" data-zona="zona1"></div>
                    <div class="zonas zona" data-zona="zona2"></div>
                    <div class="zonas zona" data-zona="zona3"></div>
                    <div class="zonas zona" data-zona="zona4"></div>
                    <div class="zonas zona" data-zona="zona5"></div>
                    <div class="zonas zona" data-zona="zona6"></div>
                    <div class="zonas zona" data-zona="zona7"></div>
                </div>

                <div class="contenedorFicha">
                    <div class="contador">Puntos: 0</div>

                    <div class="fichasContainer">
                        <img src="../../../Imagenes/dinoAzul.PNG" draggable="true" class="ficha" data-id="azul">
                        <img src="../../../Imagenes/dinoAmarillo.PNG" draggable="true" class="ficha" data-id="amarillo">
                        <img src="../../../Imagenes/dinoLila.PNG" draggable="true" class="ficha" data-id="lila">
                        <img src="../../../Imagenes/dinoNaranja.PNG" draggable="true" class="ficha" data-id="naranja">
                        <img src="../../../Imagenes/dinoRojo.PNG" draggable="true" class="ficha" data-id="rojo">
                        <img src="../../../Imagenes/dinoVerde.PNG" draggable="true" class="ficha" data-id="verde">
                    </div>
                </div>

            </section>
        </div>
    </template>

    <!-- JS -->
    <script src="juego.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
