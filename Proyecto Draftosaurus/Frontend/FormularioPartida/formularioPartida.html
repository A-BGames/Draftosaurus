<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Henny+Penny&family=Boogaloo&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

  <link rel="stylesheet" href="formularioPartida.css">
  <title>Crear nueva partida</title>
</head>

<body>

  <header id="encabezado" class="d-flex align-items-center justify-content-start px-3 pt-3">
    <div class="ms-2">
      <img src="../../Imagenes/Logo_de_empresa-removebg-preview - copia.png" alt="logo" id="imgLogo" />
    </div>
    <h1 class="fw-bold text-center flex-grow-1 mt-3">CREAR NUEVA PARTIDA</h1>
  </header>

  <main id="contenido" class="container my-4 text-center">

    <form id="formularioNuevaPartida" class="mx-auto">
      <label for="nombrePartida">Nombre de la partida:</label>
      <input type="text" id="nombrePartida" required><br>

      <label for="modoJuego">Modo de juego:</label>
      <select id="modoJuego" required>
        <option value="" disabled selected>Seleccione...</option>
        <option value="2">Normal</option>
        <option value="3">Asistido</option>
        <option value="4">Hardcore</option>
      </select><br>

      <label for="numeroJugadores">Número de jugadores:</label>
      <select id="numeroJugadores" required>
        <option value="" disabled selected>Seleccione...</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </select>

      <div id="jugadoresInputs"></div><br>

      <button type="submit">Crear Partida</button>
    </form>

    <div class="mt-4">
      <a href="../Index/index.html" class="volver-boton">Volver</a>
    </div>

    <script src="formularioPartida.js"></script>
  </main>

  <!-- FOOTER -->
  <footer id="pieNuevaPartida">
    <p id="derechos">Todos los derechos reservados por A-B GAMES S.A.S</p>
  </footer>

</body>

</html>
