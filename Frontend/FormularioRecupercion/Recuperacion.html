    <link rel="stylesheet" href="Recuperacion.css">
    <title>Restablecer contraseña</title>
</head>
<body>
    <header id="encabezado">
        <div id="logo">
            <img id="imgLogo" src="../../Imagenes/Logo_de_empresa-removebg-preview - copia.png" alt="dino"/>
        </div>

    <main id="contenido">
    <h1>Restablecer contraseña</h1>
    <form id="formularioNuevoJugador">

  </footer>
