<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

  <link rel="stylesheet" href="Recuperacion.css">
  <link href="https://fonts.googleapis.com/css2?family=Henny+Penny&family=Boogaloo&display=swap" rel="stylesheet">

  <title>Restablecer contraseña</title>
</head>

<body class="d-flex flex-column align-items-center">

  <header id="encabezado" class="d-flex align-items-center justify-content-between px-3 pt-3">
    <div class="ms-2">
      <img src="../../Imagenes/Logo_de_empresa-removebg-preview - copia.png" alt="dino" id="imgLogo" />
    </div>
    <h1 class="fw-bold text-center flex-grow-1 mt-3" data-lang="titulo_rest_contra">RESTABLECER CONTRASEÑA</h1>
    <div class="me-5"></div>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-10 col-md-8 text-center">
        <p id="descripcion" class="lead text-center mb-4" data-lang="texto_recuperacion">
          Seleccione un método para recuperar su cuenta.
        </p>
      </div>
    </div>

    <form id="formularioNuevoJugador" class="form-card mx-auto p-4">
      <label for="medio" data-lang="medio_recuperacion">Medio de recuperación:</label>
      <select id="medio" required>
        <option value="" disabled selected data-lang="seleccione">Seleccione...</option>
        <option value="2" data-lang="medio_mail">Mail</option>
        <option value="3" data-lang="medio_celular">Celular</option>
      </select>

      <div id="datosRecuperacion"></div>

      <button type="submit" class="mt-3" data-lang="restablecer">Restablecer</button>
    </form>

  </main>

  <footer id="pieDePagina">
    <p id="derechos" data-lang="derechos">Todos los derechos reservados por A-B GAMES S.A.S</p>
  </footer>

  <script src="formularioRecuperacion.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-SnwiM1b+1E2kGkI9U9n+x3ZTuk9Zy7X7K5hG+VqEvA6nCCOeDgkTqFVh3n5+6vce"
    crossorigin="anonymous"></script>
  <script src="../Idioma/lang.js"></script>

</body>

</html>
