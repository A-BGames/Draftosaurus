<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" 
          integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

    <link rel="stylesheet" href="ranking.css">
    <link href="https://fonts.googleapis.com/css2?family=Henny+Penny&family=Boogaloo&display=swap" rel="stylesheet">

    <title>Ranking</title>
</head>

<body class="d-flex flex-column align-items-center">

    <!-- HEADER -->
    <header id="encabezado" class="d-flex align-items-center justify-content-between px-3 pt-3 w-100">
        <div class="ms-2">
            <img src="../Imagenes/Logo_de_empresa-removebg-preview - copia.png" alt="dino" id="imgLogo" />
        </div>
        <h1 class="fw-bold flex-grow-1 text-center m-0">RANKING</h1>
        <div class="me-5"></div>
    </header>

    <main class="container my-4">
        <p id="descripcion" class="text-center mb-4">
            Aquí podrás ver el ranking de jugadores según sus puntajes acumulados.
        </p>

        <div class="table-responsive">
            <table class="table-bordered table-striped text-center align-middle ranking-tabla">
                <thead>
                    <tr>
                        <th>Puesto</th>
                        <th>Nombre</th>
                        <th>Puntos</th>
                    </tr>
                </thead>

                <tbody id="cuerpoRanking"></tbody>
            </table>
        </div>

        <div class="d-flex justify-content-center mt-4">
            <a href="../Index/index.html" class="volver-boton">Volver</a>
        </div>
    </main>

    <footer id="pieDePagina">
        <p id="derechos">Todos los derechos reservados por A-B GAMES S.A.S</p>
    </footer>

    <script src="ranking.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-SnwiM1b+1E2kGkI9U9n+x3ZTuk9Zy7X7K5hG+VqEvA6nCCOeDgkTqFVh3n5+6vce" 
            crossorigin="anonymous"></script>
</body>
</html>
