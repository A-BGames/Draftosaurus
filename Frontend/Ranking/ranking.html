<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

    <link rel="stylesheet" href="ranking.css">

<body class="d-flex flex-column align-items-center">
    <header id="encabezado" class="d-flex align-items-center justify-content-between px-3 pt-3 w-100">

            <img src="../../Imagenes/Logo_de_empresa-removebg-preview - copia.png" alt="dino" id="imgLogo" />
        </div>
        <h1 class="fw-bold flex-grow-1 text-center m-0" data-lang="ranking">RANKING</h1>
        <div class="me-5"></div>
    </header>

    <main class="container my-4">
        <p id="descripcion" class="text-center mb-4" data-lang="texto_ranking">
            Aquí podrás ver el ranking de jugadores según sus puntajes acumulados.
        </p>

        <div class="table-responsive">
            <table class="table-bordered table-striped text-center align-middle ranking-tabla">
                <thead>
                    <tr>
                        <th data-lang="puesto">Puesto</th>
                        <th data-lang="nombre">Nombre</th>

                    </tr>

                <tbody id="cuerpoRanking"></tbody>

        </div>

        <div class="d-flex justify-content-center mt-4">
            <a href="../Index/index.html" class="volver-boton" data-lang="volver">Volver</a>

    <footer id="pieDePagina">
        <p id="derechos" data-lang="derechos">Todos los derechos reservados por A-B GAMES S.A.S</p>
    </footer>

    <script src="ranking.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
