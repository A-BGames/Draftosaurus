<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="registro.css">
    <link href="https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Boogaloo&display=swap" rel="stylesheet">
  <title>Registro</title>
</head>
<body>
    <header id="encabezado">
        <div id="logo">
            <img id="imgLogo" src="../../../Imagenes/Logo_de_empresa-removebg-preview - copia.png" alt="dino"/>
        </div>
    </header>
    <main id="contenido">
    <h1>Registro</h1>
    <form id="formularioRegistro" action="../../Backend/Capa_de_Datos/registro.php" method="post">
      <label class="etiqueta" for="primer_nombre">Primer Nombre:</label>
  <input type="text" id="primer_nombre" name="primer_nombre" pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]{3,20}$" title="Mínimo 3 letras" required><br>
  <label class="etiqueta" for="apellido_paterno">Apellido Paterno:</label>
  <input type="text" id="apellido_paterno" name="apellido_paterno" pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]{3,20}$" title="Mínimo 3 letras" required><br>
  <label class="etiqueta" for="apellido_materno">Apellido Materno:</label>
  <input type="text" id="apellido_materno" name="apellido_materno" pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]{3,20}$" title="Mínimo 3 letras" required><br>
  <label class="etiqueta" for="nombre_usuario">Nombre de Usuario:</label>
  <input type="text" id="nombre_usuario" name="nombre_usuario" pattern="^[a-zA-Z0-9._%+ÁÉÍÓÚáéíóúÑñ\-ñÑáéíóúÁÉÍÓÚ\s]{3,50}$" title="Mínimo 3 letras" required><br>
  <label class="etiqueta" for="contraseña">Contraseña:</label>
  <input type="password" id="contraseña" name="contraseña" pattern=".{7,}" title="Mínimo 7 caracteres" required><br> 
  <label class="etiqueta" for="correo">Correo Electronico:</label>
  <input type="email" id="correo" name="correo" pattern="^[a-zA-Z0-9._%+\-ñÑáéíóúÁÉÍÓÚ]{2,30}@[a-zA-Z]{2,12}\.[a-zA-Z.]{2,12}$" title="El formato debe ser de2caracteresa30@de2letrasa12.de2letrasa12" required><br>
  <label class="etiqueta" for="celular">Celular: +598</label>
  <input type="text" id="celular" name="celular" pattern="^9[1-9][0-9]{6}$" title="El numero debe tener exactamente 8 carateres y empezar por 9 y el 3er digito debe ser del 1 al 9" required><br>
  <label class="etiqueta" for="fecha_nacimiento">Fecha de Nacimiento:</label>
  <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" max="2017-12-31" required><br>
 
  <button type="submit">Registrarse</button>
  <br>
  <a id="enlaceRegistro"href="../InicioSesion/inicioSesion.html">Ya tienes una cuenta? Inicia sesion aqui</a>
</form>
      
   
  </main>
  <footer id="pieRegistro">
    <p id="derechos">Todos los derechos reservados por A-B GAMES S.A.S</p>
  </footer>
      
</body>
</html>
