<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Henny+Penny&family=Boogaloo&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="registroPartidas.css">

  <title>Registro de Partidas</title>
</head>

<body class="text-light">

  <main id="tablerosContainer" class="container-fluid py-3 text-center">

    <div id="botonesGlobales"
      class="d-flex flex-column flex-md-row justify-content-center align-items-center gap-3 mb-4">
      <img src="../../Imagenes/dadoAgua.png" alt="dado" id="dadoGlobal" class="img-fluid" style="max-width: 100px;">
      <button id="lanzarDado" class="btn btn-success px-4 py-2 fw-bold shadow">Lanzar Dado</button>
      <div id="turnoActualTexto" class="text-warning fw-semibold text-center">Turno de: </div>
      <button id="finalizar" class="btn btn-danger px-4 py-2 fw-bold shadow">Finalizar</button>
      <button id="pausar" class="btn btn-secondary px-4 py-2 fw-bold shadow">Pausar</button>
    </div>

  </main>


  <template id="templateTablero">
    <section class="tableroJugador border rounded-4 p-3 my-4 shadow-lg">

      <h3 class="nombreJugador text-center mb-3 text-uppercase fw-bold"></h3>

      <div class="contenedorTablero mx-auto position-relative">
        <img src="../../Imagenes/drarftosurus verano.JPG" alt="verano" class="tablero rounded-3 img-fluid shadow">

        <div class="zonas zona" data-zona="zona1"></div>
        <div class="zonas zona" data-zona="zona2"></div>
        <div class="zonas zona" data-zona="zona3"></div>
        <div class="zonas zona" data-zona="zona4"></div>
        <div class="zonas zona" data-zona="zona5"></div>
        <div class="zonas zona" data-zona="zona6"></div>
        <div class="zonas zona" data-zona="zona7"></div>
      </div>

      <div class="contenedorFicha mt-4 p-3 rounded shadow-sm">
        <div class="contador fw-bold text-center text-success mb-2">Puntos: 0</div>

        <div class="fichasContainer d-flex flex-wrap justify-content-center gap-2">
          <img src="../../Imagenes/dinoAzul.png" draggable="true" class="ficha img-fluid" data-id="azul">
          <img src="../../Imagenes/dinoAmarillo.png" draggable="true" class="ficha img-fluid" data-id="amarillo">
          <img src="../../Imagenes/dinoLila.png" draggable="true" class="ficha img-fluid" data-id="lila">
          <img src="../../Imagenes/dinoNaranja.png" draggable="true" class="ficha img-fluid" data-id="naranja">
          <img src="../../Imagenes/dinoRojo.png" draggable="true" class="ficha img-fluid" data-id="rojo">
          <img src="../../Imagenes/dinoVerde.png" draggable="true" class="ficha img-fluid" data-id="verde">
        </div>
      </div>

    </section>
  </template>

  <footer id="pieDePagina" class="d-flex align-items-center justify-content-center mt-auto w-100">
    <p id="derechos" class="m-0 text-center">Todos los derechos reservados por A-B GAMES S.A.S</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
  <script src="juego.js"></script>

</body>

</html>
