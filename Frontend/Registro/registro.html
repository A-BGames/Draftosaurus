<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="registro.css">
    <title>Registro</title>
</head>
<body>
    <header id="encabezado">
        <div id="logo">
            <img id="imgLogo" src="../../Imagenes/Logo_de_empresa-removebg-preview - copia.png" alt="dino"/>
        </div>
        <h1>AB-Games</h1>
    </header>
    <main id="contenido">
    <h1>Registro</h1>
    <form id="formularioNuevoJugador">
      <label for="nombreCompleto">Nombre Completo:</label>
      <input type="text" id="nombreCompleto" required><br>
      <label for="nombreJugador">Nombre de Usuario:</label>
      <input type="text" id="nombreJugador" required><br>
      <label for="contraseña">Contraseña:</label>
      <input type="password" id="contraseña" required><br>
      <label for="correoJugador">Correo Electronico:</label>
      <input type="text" id="correoJugador" required><br>
      <label for="celularJugador">Telefono/Celular:</label>
      <input type="text" id="celularJugador" required><br>
      <label for="fechaNacimiento">Fecha de Nacimiento:</label>
      <input type="date" id="fechaNacimiento" required><br>
      <br>
      <button type="submit">Registrarse</button>
      <br>
      <a href="../InicioSesion/inicioSesion.html">Ya tienes una cuenta? Inicia sesion aqui</a>
    </form>
      
   
  </main>
  <footer id="pieNuevaPartida">
    <p id="derechos">Todos los derechos reservados por A-B GAMES S.A.S</p>
  </footer>
      
</body>
</html>
