<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="registro.css">
    <link href="https://fonts.googleapis.com/css2?family=Henny+Penny&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Boogaloo&display=swap" rel="stylesheet">
  <title>Registro</title>
</head>
<body>
    <header id="encabezado">
        <div id="logo">
            <img id="imgLogo" src="../../Imagenes/Logo_de_empresa-removebg-preview - copia.png" alt="dino"/>
        </div>
    </header>
    <main id="contenido">
    <h1>Registro</h1>
    <form id="formularioRegistro" action="../../Backend/registro.php" method="post">
  <label class="etiqueta" for="nombreCompleto">Nombre Completo:</label>
  <input type="text" id="nombreCompleto" name="nombreCompleto" pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]{3,50}$" title="Mínimo 3 letras" required><br>
  <label class="etiqueta" for="nombreJugador">Nombre de Usuario:</label>
  <input type="text" id="nombreJugador" name="nombreJugador" pattern="^[a-zA-Z0-9._%+ÁÉÍÓÚáéíóúÑñ\-ñÑáéíóúÁÉÍÓÚ\s]{3,50}$" title="Mínimo 3 letras" required><br>
  <label class="etiqueta" for="contraseña">Contraseña:</label>
  <input type="password" id="contraseña" name="contraseña" pattern=".{7,}" title="Mínimo 7 caracteres" required><br> 
  <label class="etiqueta" for="correoJugador">Correo Electronico:</label>
  <input type="email" id="correoJugador" name="correoJugador" pattern="^[a-zA-Z0-9._%+\-ñÑáéíóúÁÉÍÓÚ]{2,30}@[a-zA-Z]{2,12}\.[a-zA-Z.]{2,12}$" title="El formato debe ser de2caracteresa30@de2letrasa12.de2letrasa12" required><br>
  <label class="etiqueta" for="celularJugador">Telefono/Celular:</label>
  <input type="text" id="celularJugador" name="celularJugador" pattern="^09[1-9][0-9]{6}$" title="El numero debe tener exactamente 9 carateres y empezar por 09 y el 3er digito debe ser del 1 al 9" required><br>
  <label class="etiqueta" for="fechaNacimiento">Fecha de Nacimiento:</label>
  <input type="date" id="fechaNacimiento" name="fechaNacimiento" max="2017-12-31" required><br>
 
  <button type="submit">Registrarse</button>
  <br>
  <a id="enlaceRegistro"href="../InicioSesion/inicioSesion.html">Ya tienes una cuenta? Inicia sesion aqui</a>
</form>
      
   
  </main>
  <footer id="pieRegistro">
    <p id="derechos">Todos los derechos reservados por A-B GAMES S.A.S</p>
  </footer>
      
</body>
</html>
