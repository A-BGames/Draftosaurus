<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Henny+Penny&family=Boogaloo&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="registro.css">

  <title>Registro</title>
</head>

<body class="d-flex flex-column align-items-center">

  <header id="encabezado" class="d-flex align-items-center justify-content-between px-3 pt-3">
    <div class="ms-2">
      <img src="../../Imagenes/Logo_de_empresa-removebg-preview - copia.png" alt="dino" id="imgLogo" />
    </div>
    <h1 class="fw-bold text-center flex-grow-1 mt-3" data-lang="titulo_registro">REGISTRO</h1>
    <div class="me-5"></div>
  </header>

  <main id="contenido" class="container d-flex flex-column align-items-center mt-3">

    <div class="row justify-content-center">
      <div class="col-10 col-md-8 text-center">
        <p id="descripcion" class="lead text-center mb-4" data-lang="texto_registro">
          ¡Regístrate para comenzar a jugar!
        </p>

      </div>
    </div>

    <form id="formularioRegistro" class="d-flex flex-column align-items-center"
      action="../../Backend/Capa_de_Datos/registro.php" method="post">

      <label class="etiqueta mt-2" for="primer_nombre" data-lang="primer_nombre">Primer Nombre:</label>
      <input type="text" id="primer_nombre" name="primer_nombre" required>

      <label class="etiqueta mt-3" for="apellido_paterno" data-lang="apellido_paterno">Apellido Paterno:</label>
      <input type="text" id="apellido_paterno" name="apellido_paterno" required>

      <label class="etiqueta mt-3" for="apellido_materno" data-lang="apellido_materno">Apellido Materno:</label>
      <input type="text" id="apellido_materno" name="apellido_materno" required>

      <label class="etiqueta mt-3" for="nombre_usuario" data-lang="nombre_usuario">Nombre de Usuario:</label>
      <input type="text" id="nombre_usuario" name="nombre_usuario" required>

      <label class="etiqueta mt-3" for="contraseña" data-lang="contraseña">Contraseña:</label>
      <input type="password" id="contraseña" name="contraseña" required>

      <label class="etiqueta mt-3" for="correo" data-lang="correo_electronico">Correo Electrónico:</label>
      <input type="email" id="correo" name="correo" required>

      <label class="etiqueta mt-3" for="celular" data-lang="celular">Celular (+598):</label>
      <input type="text" id="celular" name="celular" required>

      <label class="etiqueta mt-3" for="fecha_nacimiento" data-lang="fecha_nacimiento">Fecha de Nacimiento:</label>
      <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>

      <button type="submit" class="mt-3" data-lang="registrarse">Registrarse</button>

      <a id="enlaceRegistro" class="mt-3" href="../InicioSesion/inicioSesion.html" data-lang="ya_tienes_cuenta">
        ¿Ya tienes una cuenta? Inicia sesión aquí
      </a>

    </form>

  </main>

  <footer id="pieDePagina" class="text-center py-3">
    <p id="derechos" data-lang="derechos">Todos los derechos reservados por A-B GAMES S.A.S</p>
  </footer>

  <script src="../Idioma/lang.js"></script>
</body>

</html>
